{% extends 'base.html' %}{% block content %}<h2>Leads</h2><form method="post"><input name="company_name" placeholder="Empresa" required><input type="date" name="created_date" required><select name="source"><option>WEB</option><option>REFERRAL</option><option>EVENT</option><option>OUTBOUND</option><option>PARTNER</option><option>PHONE</option></select><input name="industry" value="Technology" required><select name="sales_rep_id">{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}}</option>{% endfor %}</select><button>Crear lead</button></form><table><tr><th>ID</th><th>Empresa</th><th>Estado</th><th>Acción</th></tr>{% for r in records %}<tr><td>{{r.lead_id}}</td><td>{{r.company_name}}</td><td>{{r.status}}</td><td><form method="post" action="/leads/{{r.lead_id}}/convert"><select name="sales_rep_id">{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}}</option>{% endfor %}</select><button>Convertir</button></form></td></tr>{% endfor %}</table>{% endblock %}
