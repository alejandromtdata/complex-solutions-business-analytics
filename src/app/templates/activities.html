{% extends 'base.html' %}{% block content %}<h2>Actividades CRM</h2><form method="post"><input name="opportunity_id" type="number" placeholder="ID oportunidad" required><select name="employee_id">{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}}</option>{% endfor %}</select><select name="activity_type"><option>CALL</option><option>EMAIL</option><option>MEETING</option><option>DEMO</option><option>PROPOSAL</option><option>NOTE</option></select><input type="date" name="activity_date" required><button>Registrar</button></form><table><tr><th>ID</th><th>Oportunidad</th><th>Tipo</th><th>Fecha</th></tr>{% for r in records %}<tr><td>{{r.activity_id}}</td><td>{{r.opportunity_id}}</td><td>{{r.activity_type}}</td><td>{{r.activity_date}}</td></tr>{% endfor %}</table>{% endblock %}
