{% extends 'base.html' %}{% block content %}<h2>Productos</h2><form method="post"><input name="sku" placeholder="SKU" required><input name="product_name" placeholder="Nombre" required><select name="category_id">{% for c in categories %}<option value="{{c.category_id}}">{{c.category_name}}</option>{% endfor %}</select><input name="brand" placeholder="Marca" required><select name="supplier_id">{% for s in suppliers %}<option value="{{s.supplier_id}}">{{s.supplier_name}}</option>{% endfor %}</select><input name="cost_price" type="number" step=".01" placeholder="Coste" required><input name="list_price" type="number" step=".01" placeholder="Precio" required><button>Crear</button></form><table><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th>Stock</th></tr>{% for r in records %}<tr><td>{{r.sku}}</td><td>{{r.product_name}}</td><td>{{r.category_name}}</td><td>{{r.stock}}</td></tr>{% endfor %}</table>{% endblock %}
