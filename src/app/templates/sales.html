{% extends 'base.html' %}{% block content %}<h2>Ventas</h2><p>Las líneas se introducen como JSON: <code>[{"product_id":1,"quantity":1,"unit_price":100,"discount":0.1}]</code></p><form method="post"><select name="customer_id">{% for c in customers %}<option value="{{c.customer_id}}">{{c.company_name}}</option>{% endfor %}</select><select name="employee_id">{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}}</option>{% endfor %}</select><input type="date" name="sale_date" required><select name="channel"><option>PHYSICAL_STORE</option><option>ONLINE</option><option>B2B</option></select><textarea name="lines_json" required></textarea><button>Confirmar venta</button></form><table><tr><th>ID</th><th>Cliente</th><th>Fecha</th><th>Canal</th></tr>{% for r in records %}<tr><td>{{r.sale_id}}</td><td>{{r.company_name}}</td><td>{{r.sale_date}}</td><td>{{r.channel}}</td></tr>{% endfor %}</table>{% endblock %}
