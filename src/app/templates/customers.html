{% extends 'base.html' %}{% block content %}<h2>Clientes</h2><form method="post"><select name="customer_type"><option>B2B</option><option>B2C</option></select><input name="company_name" placeholder="Empresa / nombre" required><select name="customer_segment"><option>SMB</option><option>CONSUMER</option><option>ENTERPRISE</option><option>PUBLIC_SECTOR</option></select><input name="city" placeholder="Ciudad" required><input name="province" placeholder="Provincia" required><input type="date" name="signup_date" required><select name="acquisition_channel"><option>ONLINE</option><option>PHYSICAL_STORE</option><option>OUTBOUND_SALES</option><option>REFERRAL</option><option>PARTNER</option><option>EVENT</option></select><select name="sales_rep_id"><option value="">Sin asignar</option>{% for e in employees %}<option value="{{e.employee_id}}">{{e.name}}</option>{% endfor %}</select><button>Crear</button></form><table><tr><th>ID</th><th>Nombre</th><th>Tipo</th><th>Ciudad</th><th>Comercial</th></tr>{% for r in records %}<tr><td>{{r.customer_id}}</td><td>{{r.company_name}}</td><td>{{r.customer_type}}</td><td>{{r.city}}</td><td>{{r.sales_rep}}</td></tr>{% endfor %}</table>{% endblock %}
