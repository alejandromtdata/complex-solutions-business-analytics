{% extends 'base.html' %}{% block content %}<h2>Inventario</h2><form method="post" action="/inventory/adjust"><select name="product_id">{% for p in products %}<option value="{{p.product_id}}">{{p.sku}}</option>{% endfor %}</select><input type="date" name="movement_date" required><input type="number" name="quantity" placeholder="± unidades" required><input type="number" step=".01" name="unit_cost" placeholder="Coste" required><button>Ajustar</button></form><table><tr><th>SKU</th><th>Producto</th><th>Stock</th></tr>{% for r in records %}<tr><td>{{r.sku}}</td><td>{{r.product_name}}</td><td>{{r.stock}}</td></tr>{% endfor %}</table>{% endblock %}
