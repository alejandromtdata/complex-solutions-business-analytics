{% extends 'base.html' %}{% block content %}<h2>Compras</h2><form method="post"><select name="supplier_id">{% for s in suppliers %}<option value="{{s.supplier_id}}">{{s.supplier_name}}</option>{% endfor %}</select><input type="date" name="purchase_date" required><textarea name="lines_json" placeholder='[{"product_id":1,"quantity":10,"unit_cost":20}]' required></textarea><button>Registrar compra</button></form><table><tr><th>ID</th><th>Proveedor</th><th>Fecha</th><th>Estado</th></tr>{% for r in records %}<tr><td>{{r.purchase_id}}</td><td>{{r.supplier_name}}</td><td>{{r.purchase_date}}</td><td>{{r.status}}</td></tr>{% endfor %}</table>{% endblock %}
