{% extends 'base.html' %}{% block content %}<h2>Oportunidades</h2><table><tr><th>ID</th><th>Cliente</th><th>Etapa</th><th>Valor</th><th>Actualizar</th></tr>{% for r in records %}<tr><td>{{r.opportunity_id}}</td><td>{{r.company_name}}</td><td>{{r.stage}}</td><td>{{r.estimated_value}}</td><td><form method="post" action="/opportunities/{{r.opportunity_id}}/stage"><select name="stage"><option>PROSPECTING</option><option>QUALIFICATION</option><option>PROPOSAL</option><option>NEGOTIATION</option><option>CLOSED_WON</option><option>CLOSED_LOST</option></select><input name="probability" type="number" step=".01" min="0" max="1" value="{{r.probability}}"><button>Guardar</button></form></td></tr>{% endfor %}</table>{% endblock %}
